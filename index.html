<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Calculator</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="main">
      <div class="calculator">
        <div class="screen">
          <div class="screen-prev">5555</div>
          <div class="screen-current">1234</div>
        </div>
        <div class="btn-grid">
          <button class="btn big" id="clearBtn">CLEAR</button>
          <button class="btn big" id="deleteBtn">DELETE</button>
          <button class="btn small">7</button>
          <button class="btn small">8</button>
          <button class="btn small">9</button>
          <button class="btn small">%</button>
          <button class="btn small">4</button>
          <button class="btn small">5</button>
          <button class="btn small">6</button>
          <button class="btn small">x</button>
          <button class="btn small">1</button>
          <button class="btn small">2</button>
          <button class="btn small">3</button>
          <button class="btn small">-</button>
          <button class="btn small">.</button>
          <button class="btn small">0</button>
          <button class="btn small">=</button>
          <button class="btn small">+</button>
        </div>
      </div>

    </main>
    <footer class="footer">
      <p>
        Copyright © <span id="year"></span>
      </p>
      <a href="https://github.com/dev090613" target="_blank" >
        <img src="./github-mark.svg" class='github-logo' alt="github logo image">
      </a>
    </footer>
  </body>
</html>
