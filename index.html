<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Calculator</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <div class="screen">0</div>
      <div class="buttons-grid">
        <button class="btn 1st" id="clearBtn">CLEAR</button>
        <button class="btn 1st" id="deleteBtn">DELETE</button>
        <button class="btn" id="numBtn">7</button>
        <button class="btn" id="numBtn">8</button>
        <button class="btn" id="numBtn">9</button>
        <button class="btn" id="numBtn">%</button>
        <button class="btn" id="numBtn">4</button>
        <button class="btn" id="numBtn">5</button>
        <button class="btn" id="numBtn">6</button>
        <button class="btn" id="numBtn">x</button>
        <button class="btn" id="numBtn">1</button>
        <button class="btn" id="numBtn">2</button>
        <button class="btn" id="numBtn">3</button>
        <button class="btn" id="numBtn">-</button>
        <button class="btn" id="numBtn">.</button>
        <button class="btn" id="numBtn">0</button>
        <button class="btn" id="numBtn">=</button>
        <button class="btn" id="numBtn">+</button>
      </div>

    </main>
    <footer class="footer">
      <p>
        Copyright © <span id="year"></span>
      </p>
      <a href="https://github.com/dev090613" target="_blank" >
        <img src="./github-mark.svg" class='github-log' alt="github logo image">
      </a>
    </footer>
  </body>
</html>
